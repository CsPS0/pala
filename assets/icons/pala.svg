<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Smooth drop shadow for subtle depth if needed -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="118" fill="#FF8800" />

  <!-- Outer Board Frame -->
  <rect x="110" y="80" width="292" height="352" rx="42" fill="#FFA033" stroke="#000000" stroke-width="22" stroke-linejoin="round" />

  <!-- Inner Slate Blackboard Surface -->
  <rect x="144" y="114" width="224" height="284" rx="20" fill="#323238" stroke="#000000" stroke-width="18" stroke-linejoin="round" />

  <!-- Chalk Stick (Tilted 45 degrees in bottom right) -->
  <!-- Outer black stroke -->
  <line x1="310" y1="365" x2="345" y2="320" stroke="#000000" stroke-width="36" stroke-linecap="round" />
  <!-- Inner white chalk fill -->
  <line x1="310" y1="365" x2="345" y2="320" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
</svg>
