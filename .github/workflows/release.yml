name: Release Builder

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: pala-linux
            asset_name: pala-linux
          - os: windows-latest
            artifact_name: pala.exe
            asset_name: pala.exe
          - os: macos-latest
            artifact_name: pala-macos
            asset_name: pala-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Install dependencies
        run: dart pub get

      - name: Compile Windows executable
        if: matrix.os == 'windows-latest'
        run: dart compile exe bin/pala.dart -S debug-info-windows.map -o ${{ matrix.artifact_name }}

      - name: Compile Linux executable & Create .deb package
        if: matrix.os == 'ubuntu-latest'
        run: |
          dart compile exe bin/pala.dart -S debug-info-linux.map -o ${{ matrix.artifact_name }}

          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0"
          elif [[ ! "$VERSION" =~ ^[0-9] ]]; then
            CLEAN_NAME=$(echo "$VERSION" | tr '-' '.')
            VERSION="0.0.0+${CLEAN_NAME}"
          fi

          mkdir -p deb_pkg/usr/bin
          cp ${{ matrix.artifact_name }} deb_pkg/usr/bin/pala
          chmod +x deb_pkg/usr/bin/pala

          mkdir -p deb_pkg/DEBIAN
          cat <<EOF > deb_pkg/DEBIAN/control
          Package: pala
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Solti Csongor Péter <csps0@users.noreply.github.com>
          Description: Interaktív terminálos felület (TUI) a Kréta e-napló rendszerhez.
          EOF

          dpkg-deb --build deb_pkg pala_${VERSION}_amd64.deb
          # Fixed-name copy: the website always links releases/latest/download/pala_amd64.deb
          cp pala_${VERSION}_amd64.deb pala_amd64.deb
          echo "DEB_VERSIONED=pala_${VERSION}_amd64.deb" >> $GITHUB_ENV

          # pala-linux-x64.tar.gz: fixed-name tarball the website links for direct download
          mkdir -p tarpkg
          cp ${{ matrix.artifact_name }} tarpkg/pala
          chmod +x tarpkg/pala
          tar -czf pala-linux-x64.tar.gz -C tarpkg pala

      - name: Upload .deb for APT Repo
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian-package
          path: ${{ env.DEB_VERSIONED }}
          retention-days: 1

      - name: Compile macOS executable
        if: matrix.os == 'macos-latest'
        run: dart compile exe bin/pala.dart -S debug-info-macos.map -o ${{ matrix.artifact_name }}

      - name: Package macOS CLI zip
        if: matrix.os == 'macos-latest'
        run: zip pala-macos.zip ${{ matrix.artifact_name }}

      - name: Package Windows CLI zip
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath pala-windows-x64.zip

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.artifact_name }}
            *.deb
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-windows-installer:
    name: Build Windows Installer (Pala-Setup.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Build Flutter Desktop app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Compile standalone CLI exe (bundled by the installer)
        run: |
          dart pub get
          dart compile exe bin/pala.dart -o pala.exe

      - name: Compile installer with Inno Setup
        run: iscc packaging\windows\pala_installer.iss

      - name: Upload installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: false
          files: dist/Pala-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-macos-dmg:
    name: Build macOS App & DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Build Flutter Desktop app
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package DMG
        run: |
          mkdir -p dmg_root
          cp -R app/build/macos/Build/Products/Release/*.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Pala" -srcfolder dmg_root -ov -format UDZO Pala-macOS.dmg

      - name: Upload DMG to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: false
          files: Pala-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      # Unsigned on purpose: no paid Apple developer account. Users sign it on
      # their own machine with their free Apple ID (AltStore or Sideloadly).
      - name: Build Flutter iOS app without code signing
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R app/build/ios/iphoneos/Runner.app Payload/
          zip -qry Pala.ipa Payload

      - name: Upload IPA to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: false
          files: Pala.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Build Flutter Desktop app
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release

      - name: Assemble AppDir
        run: |
          set -e
          APPDIR=AppDir
          BUNDLE=app/build/linux/x64/release/bundle
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -R "$BUNDLE"/* "$APPDIR/usr/bin/"
          cp assets/icons/pala_icon_256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/pala.png"
          cp assets/icons/pala_icon_256.png "$APPDIR/pala.png"
          cat > "$APPDIR/usr/share/applications/pala.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Pala
          Exec=palapp
          Icon=pala
          Categories=Education;
          EOF
          cp "$APPDIR/usr/share/applications/pala.desktop" "$APPDIR/pala.desktop"
          ln -sf usr/bin/palapp "$APPDIR/AppRun"

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run AppDir Pala-x86_64.AppImage

      - name: Upload AppImage to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: false
          files: Pala-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Set up release signing key
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Android signing secrets missing, APKs will be signed with a throwaway debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/pala-release.jks
          cat > key.properties <<EOF
          storeFile=pala-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build split & universal APKs
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APKs to release asset names
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          cp app-release.apk pala-universal.apk
          cp app-arm64-v8a-release.apk pala-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk pala-armeabi-v7a.apk
          cp app-x86_64-release.apk pala-x86_64.apk

      - name: Upload APKs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: false
          files: |
            app/build/app/outputs/flutter-apk/pala-universal.apk
            app/build/app/outputs/flutter-apk/pala-arm64-v8a.apk
            app/build/app/outputs/flutter-apk/pala-armeabi-v7a.apk
            app/build/app/outputs/flutter-apk/pala-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  extension:
    name: Package Browser Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Zip extension
        run: cd extension && zip -r ../pala-extension.zip . -x "test/*"
      - name: Upload extension zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: false
          files: pala-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Publish SHA256SUMS
    # After every job that uploads release assets, so the file covers all of them.
    needs: [build, desktop-windows-installer, desktop-macos-dmg, ios-ipa, desktop-linux-appimage, android, extension]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Hash the release assets and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  apt-repo:
    name: Build APT Repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download .deb packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: debian-package
          path: deb_packages
          
      - name: Generate APT Repository
        uses: smeinecke/apt-repo-action@f444ced102c5d453dea873186674c38d675afda8 # v2.1.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_arch: amd64
          repo_supported_version: stable
          file: deb_packages/*.deb
          file_target_version: stable
          private_key: ${{ secrets.APT_SIGNING_KEY }}

  update-manifests:
    name: Auto-update Scoop & Homebrew Manifests
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && !github.event.release.prerelease
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Download Windows Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binary-windows-latest
          path: bin-win

      - name: Download Linux Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binary-ubuntu-latest
          path: bin-lin

      - name: Download macOS Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binary-macos-latest
          path: bin-mac

      - name: Update Manifests
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.2.0"; fi
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then
            echo "Non-semantic release version '$VERSION', skipping manifest updates."
            exit 0
          fi
          
          WIN_HASH=$(sha256sum bin-win/pala.exe | awk '{print $1}')
          LIN_HASH=$(sha256sum bin-lin/pala-linux | awk '{print $1}')
          MAC_HASH=$(sha256sum bin-mac/pala-macos | awk '{print $1}')
          
          export VERSION WIN_HASH LIN_HASH MAC_HASH
          
          python3 - << 'EOF'
          import os, json, re
          
          version = os.environ['VERSION']
          win_hash = os.environ['WIN_HASH']
          lin_hash = os.environ['LIN_HASH']
          mac_hash = os.environ['MAC_HASH']
          
          # 1. Update Scoop manifest
          scoop_path = 'bucket/pala.json'
          with open(scoop_path, 'r', encoding='utf-8') as f:
              scoop_data = json.load(f)
          
          scoop_data['version'] = version
          scoop_data['architecture']['64bit']['url'] = f"https://github.com/CsPS0/pala/releases/download/v{version}/pala.exe"
          scoop_data['architecture']['64bit']['hash'] = win_hash
          
          with open(scoop_path, 'w', encoding='utf-8') as f:
              json.dump(scoop_data, f, indent=4)
          
          # 2. Update Homebrew formula
          brew_path = 'Formula/pala.rb'
          with open(brew_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          content = re.sub(r'version \".*?\"', f'version "{version}"', content)
          content = re.sub(r'releases/download/v.*/pala-macos', f'releases/download/v{version}/pala-macos', content)
          content = re.sub(r'releases/download/v.*/pala-linux', f'releases/download/v{version}/pala-linux', content)
          
          content = re.sub(r'(on_macos do\s+url.*?\s+sha256\s+\")[a-f0-9]+(\")', r'\g<1>' + mac_hash + r'\g<2>', content, flags=re.DOTALL)
          content = re.sub(r'(on_linux do\s+url.*?\s+sha256\s+\")[a-f0-9]+(\")', r'\g<1>' + lin_hash + r'\g<2>', content, flags=re.DOTALL)
          
          with open(brew_path, 'w', encoding='utf-8') as f:
              f.write(content)
          
          # 3. Update AUR PKGBUILD
          aur_path = 'packaging/PKGBUILD'
          with open(aur_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          content = re.sub(r'pkgver=.*', f'pkgver={version}', content)
          content = re.sub(r'pkgrel=.*', 'pkgrel=1', content)
          content = re.sub(r'sha256sums=\(\'.*?\'\)', f"sha256sums=('{lin_hash}')", content)

          with open(aur_path, 'w', encoding='utf-8') as f:
              f.write(content)

          # 4. Update Windows installer version (Inno Setup)
          iss_path = 'packaging/windows/pala_installer.iss'
          with open(iss_path, 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(r'#define MyAppVersion ".*?"', f'#define MyAppVersion "{version}"', content)

          with open(iss_path, 'w', encoding='utf-8') as f:
              f.write(content)
          EOF
          
          # Configure Git and Push
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/pala.json Formula/pala.rb packaging/PKGBUILD packaging/windows/pala_installer.iss
          git commit -m "chore: auto-update scoop, homebrew, and aur manifests to v$VERSION [skip ci]"
          git push origin HEAD:main

  aur:
    name: Publish to AUR
    # Runs after update-manifests, so it publishes the PKGBUILD with the new
    # version and hash instead of the one in the tagged commit.
    needs: update-manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@a97f56a8425a7a7f3b8c58607f769c69b089cadb # v3.0.1
        with:
          pkgname: pala-bin
          pkgbuild: ./packaging/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519
